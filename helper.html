<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub - Full Page Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <h1>🎮 Game Hub</h1>
    <nav>
        <a data-game="snake">Snake</a>
        <a data-game="tictactoe">Tic Tac Toe</a>
        <a data-game="memory">Memory</a>
        <a data-game="dice">Dice</a>
        <a data-game="wordle">Wordle</a>
    </nav>
</header>

<main>
    <!-- Snake -->
    <section id="snake" class="game-section active">
        <h2>Snake Game 🐍</h2>
        <div class="snake-container">
            <div class="snake-score">Score: <span id="snakeScore">0</span></div>
            <canvas id="snakeBoard" width="400" height="400"></canvas>
            <div class="snake-controls">
                <button id="startSnake">Start Game</button>
                <button id="pauseSnake">Pause</button>
                <button id="resetSnake">Reset</button>
            </div>
            <div class="snake-instructions">
                <p>Use arrow keys to move the snake.</p>
            </div>
        </div>
    </section>

    <!-- Tic Tac Toe -->
    <section id="tictactoe" class="game-section">
        <h2>Tic Tac Toe 🎯</h2>
        <div class="tictactoe-board">
            <div class="row">
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
            </div>
            <div class="row">
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
            </div>
            <div class="row">
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
                <div class="cell" data-cell></div>
            </div>
        </div>
        <button id="resetTic">Restart Game</button>
    </section>

    <!-- Memory -->
    <section id="memory" class="game-section">
        <h2>Memory 🧠</h2>
        <div class="memory-board">
            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>
            <div class="card">?</div>
        </div>
        <button id="resetMemory">Restart Memory</button>
    </section>

    <!-- Dice -->
    <section id="dice" class="game-section">
        <h2>Dice 🎲</h2>
        <div class="dice-display">🎲</div>
        <button id="rollDice">Roll Dice</button>
    </section>

    <!-- Wordle -->
    <section id="wordle" class="game-section">
        <h2>Wordle 📝</h2>
        <div class="wordle-board">
            <div class="row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
            <div class="row">
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
        </div>
        <input type="text" id="wordleInput" maxlength="5" placeholder="Enter 5-letter word">
        <button id="submitWord">Submit</button>
    </section>
</main>

<script>
    // Game section toggle
    const links = document.querySelectorAll('header nav a');
    const sections = document.querySelectorAll('.game-section');
    links.forEach(link => {
        link.addEventListener('click', () => {
            const game = link.getAttribute('data-game');
            sections.forEach(sec => {
                sec.style.display = (sec.id === game) ? 'block' : 'none';
            });
        });
    });

    // Show first game by default
    sections.forEach(sec => sec.style.display = 'none');
    document.getElementById('snake').style.display = 'block';
</script>

</body>
</html>
