<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300 flex items-center justify-center min-h-screen">
    
    <!-- Navbar (Public View) -->
    <header class="navbar fixed top-0 w-full bg-white dark:bg-gray-800 shadow-xl rounded-b-xl">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="Home.html" class="flex items-center space-x-2">
                <span class="text-3xl text-blue-500 transition-transform transform hover:rotate-12">🎮</span>
                <h1 class="text-2xl font-extrabold text-gray-800 dark:text-gray-100">Game Hub</h1>
            </a>
            <nav class="hidden md:flex space-x-4">
                <a href="Home.html" class="py-2 px-4 rounded-lg font-medium text-gray-600 hover:text-blue-500 dark:text-gray-300 dark:hover:text-blue-400 transition-colors">Home</a>
                <a href="login.html" class="py-2 px-4 rounded-lg font-medium text-blue-500 dark:text-blue-400 transition-colors border-b-2 border-blue-500">Login</a>
                <a href="signup.html" class="py-2 px-4 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 transition-transform transform hover:scale-105 active:scale-95 shadow-lg">Sign Up</a>
            </nav>
            <button id="mobileMenuBtn" class="md:hidden p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 transition-colors duration-300 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            </button>
        </div>
    </header>
    
    <!-- Main Content (Centered Form) -->
    <main class="w-full max-w-md p-8 md:p-10 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl transition-colors duration-300 border-t-4 border-blue-500 mt-20 md:mt-0">
        <h2 class="text-3xl font-bold text-center text-gray-800 dark:text-gray-100 mb-8">Login to Game Hub</h2>
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="loginEmail" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
                <input type="email" id="loginEmail" required class="mt-1 block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl shadow-inner focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-gray-100 transition-colors" placeholder="user@example.com">
            </div>
            <div>
                <label for="loginPassword" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                <input type="password" id="loginPassword" required class="mt-1 block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl shadow-inner focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-gray-100 transition-colors" placeholder="Enter your secure password">
            </div>
            <div>
                <!-- This button will use JS to handle login and redirect to games.html -->
                <button type="submit" class="w-full px-4 py-3 text-white bg-blue-500 rounded-xl hover:bg-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-500/50 transition-transform transform hover:scale-[1.01] active:scale-95 shadow-lg font-bold text-lg">
                    Log In
                </button>
            </div>
        </form>
        <p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
            Don't have an account?
            <a href="signup.html" class="font-bold text-blue-500 hover:text-blue-600 transition-colors">Sign Up Here</a>
        </p>
    </main>

    <!-- Modal for messages (Requires JS to show/hide) -->
    <div id="game-message-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-[100]">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-8 shadow-2xl text-center max-w-sm w-full transform transition-all duration-300" id="modal-content">
            <h3 id="modal-title" class="text-3xl font-extrabold text-gray-800 dark:text-gray-100 mb-4"></h3>
            <p id="modal-message" class="text-gray-600 dark:text-gray-400 mb-6 text-lg"></p>
            <button id="modal-close" class="px-6 py-3 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600 transition-transform transform hover:scale-105 active:scale-95 shadow-lg">
                Close
            </button>
        </div>
    </div>
    
</body>
</html>
